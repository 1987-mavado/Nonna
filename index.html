<meta charset="UTF-8">

<title>Nonna – Zutaten rein, Rezept raus.</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Farbe */
  --bg-top:#F7FAFD; --bg-bottom:#EDF3F8;
  --surface:#FFFFFF;
  --blue-050:#F0F5FA; --blue-100:#E3EDF5; --blue-200:#CCDEEC; --blue-300:#A6C6DC;
  --blue-500:#5E92B5; --blue-700:#2F5B7C; --blue-900:#1C384D;
  --ink:#243038; --muted:#687884; --line:#DFE8F0;
  --warm:#E3A85C; --warm-soft:#F7EBD8;
  --good:#4E9B6F; --bad:#C4573B;
  /* Raster: 4px-Basis */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px; --s7:40px;
  --pad:20px;
  --radius:18px; --radius-s:13px;
  --serif:'Fraunces',Georgia,serif;
  --display:'Archivo',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --shadow:0 8px 24px rgba(28,56,77,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#E9F0F6;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
#frame{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;
  background:
    radial-gradient(circle at 1px 1px, rgba(94,146,181,.13) 1px, transparent 0) 0 0/22px 22px,
    linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
  box-shadow:0 0 60px rgba(28,56,77,.10)}
/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:var(--s5) var(--pad) var(--s3)}
.wordmark{font-family:var(--serif);font-weight:700;font-style:italic;font-size:28px;letter-spacing:-.01em;color:var(--blue-900);display:flex;align-items:center;gap:10px}
.wordmark svg{display:block}
.chip-btn{border:0;cursor:pointer;font-family:var(--body);font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--blue-700)}
.chip-btn.pro-on{background:var(--warm-soft);border-color:#EBD9BC;color:#966A22}
.chip-btn.on{background:var(--blue-700);border-color:var(--blue-700);color:#fff}
/* Main + Raster */
main{flex:1;overflow-y:auto;padding:0 var(--pad) 120px}
h1.screen{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.03em;color:var(--blue-900);margin:var(--s4) 0 var(--s2)}
.sub{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 var(--s6)}
.sec-label{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-500);margin:var(--s6) 0 var(--s3)}
.back{border:0;background:none;cursor:pointer;font-family:var(--body);font-weight:600;font-size:14px;color:var(--blue-700);padding:0;margin:var(--s4) 0 0;display:inline-flex;align-items:center;gap:6px;height:28px}
.nonna-says{display:flex;gap:10px;align-items:flex-start;margin:0 0 var(--s5)}
.nonna-says .bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:14px;line-height:1.45}
.nonna-face{flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:var(--blue-100);display:flex;align-items:center;justify-content:center;font-size:17px}
/* Cards & Buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s4) var(--s5);box-shadow:var(--shadow);margin-bottom:var(--s3)}
.btn{display:block;width:100%;border:0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em;padding:var(--s4);border-radius:16px;background:var(--blue-700);color:#fff;transition:transform .08s ease}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--blue-200);color:#fff;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--blue-700);border:1.5px solid var(--blue-200)}
.btn.warm{background:var(--warm);color:#4A3312}
.btn:focus-visible,.chip-btn:focus-visible,.opt:focus-visible{outline:3px solid var(--blue-500);outline-offset:2px}
.row{display:flex;gap:var(--s3)}
.row .btn{flex:1}
.stack>*+*{margin-top:var(--s3)}
/* Inputs */
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:var(--s4);font-family:var(--body);font-size:16px;color:var(--ink);resize:none}
.field:focus{outline:none;border-color:var(--blue-500)}
input.field{height:52px}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s2) 0 0}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--blue-200);color:var(--blue-900);font-size:14px;font-weight:500;padding:7px 8px 7px 13px;border-radius:999px}
.chip button{border:0;background:var(--blue-100);color:var(--blue-900);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
/* Fragen-Flow */
.q-wrap{padding-top:var(--s5);max-width:520px}
.q-eyebrow{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-500);margin-bottom:var(--s3)}
.q-title{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.08;letter-spacing:-.03em;color:var(--blue-900);margin-bottom:var(--s6)}
.opts{display:flex;flex-direction:column;gap:var(--s3)}
.opt{text-align:left;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:var(--s4);font-family:var(--body);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--blue-300)}
.opt.sel{border-color:var(--blue-700);background:var(--blue-050)}
.opt .t{font-weight:600;font-size:15.5px}
.opt .s{font-size:13px;color:var(--muted);margin-top:2px}
.q-progress{display:flex;gap:6px;margin-bottom:var(--s5)}
.q-progress i{height:4px;flex:1;border-radius:2px;background:var(--blue-200)}
.q-progress i.on{background:var(--blue-700)}
/* Loader */
.loader{min-height:calc(100dvh - 240px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s5)}
.pot{width:120px;height:120px}
.steam{stroke:var(--blue-500);stroke-width:5;stroke-linecap:round;fill:none;opacity:0;animation:steam 2.2s infinite ease-out}
.steam.s2{animation-delay:.5s}.steam.s3{animation-delay:1s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-16px)}}
.spoon{transform-origin:60px 78px;animation:stir 1.6s infinite ease-in-out}
@keyframes stir{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@media (prefers-reduced-motion:reduce){.steam,.spoon{animation:none}.steam{opacity:.5}}
.loader .phrase{font-family:var(--display);font-weight:700;font-size:18px;color:var(--blue-900);min-height:26px}
.loader .small{font-size:13px;color:var(--muted)}
/* Konzept-Karten */
.concept-grid{display:flex;flex-direction:column;gap:var(--s3)}
.concept{margin-bottom:0;cursor:pointer}
.concept .k-num{font-family:var(--display);font-weight:800;font-size:13px;color:var(--blue-500);letter-spacing:.1em}
.concept h3{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--blue-900);margin:var(--s1) 0 var(--s2)}
.concept p{font-size:14px;line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.concept .taste{font-size:13px;color:var(--muted);margin-top:var(--s2);line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden}
.meta{display:flex;gap:var(--s2);margin-top:var(--s3)}
.tag{font-size:12px;font-weight:600;background:var(--blue-050);color:var(--blue-700);padding:5px 10px;border-radius:999px}
.tag.w{background:var(--warm-soft);color:#966A22}
/* Rezept */
.r-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s5)}
.r-head h1{flex:1 1 auto;min-width:0}
.heart{border:1.5px solid var(--line);background:var(--surface);width:46px;height:46px;flex:0 0 46px;border-radius:14px;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;color:var(--blue-300)}
.heart.on{color:var(--bad);border-color:#EED4CB;background:#FBF1ED}
.header-actions{display:flex;align-items:center;gap:8px}
.heart-badge{border:1.5px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;color:var(--blue-300)}
.heart-badge.on{color:var(--bad);border-color:#EED4CB;background:#FBF1ED}
.zutat{display:flex;justify-content:space-between;gap:var(--s4);padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.zutat:last-child{border-bottom:0}
.zutat .m{color:var(--blue-700);font-weight:600;white-space:nowrap}
.step{display:flex;gap:var(--s4);margin-bottom:var(--s4)}
.step .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--blue-700);color:#fff;font-family:var(--display);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.step p{font-size:14.5px;line-height:1.55;padding-top:4px}
.step-body{flex:1;min-width:0}
.step-timer{display:flex;align-items:center;gap:var(--s2);margin-top:8px}
.step-timer .t-disp{font-family:var(--display);font-weight:700;font-size:15px;min-width:44px;color:var(--blue-700)}
.step-timer.running .t-disp{color:var(--warm-dark,#966A22)}
.step-timer .t-btn{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--blue-700)}
.stove-ic{font-size:13px}
/* Tabbar */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:760px;background:rgba(247,250,253,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:var(--s2) var(--s2) calc(10px + env(safe-area-inset-bottom));z-index:30}
nav button{flex:1;border:0;background:none;cursor:pointer;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px}
nav button.on{color:var(--blue-700)}
nav button .ic{font-size:20px;line-height:1}
nav button .lock-mini{font-size:9px;color:var(--warm)}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(28,56,77,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg-top);width:100%;max-width:760px;border-radius:26px 26px 0 0;padding:var(--s6) var(--pad) calc(var(--s6) + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto}
.sheet h2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;color:var(--blue-900);margin-bottom:var(--s2)}
.benefit{display:flex;gap:var(--s3);align-items:flex-start;margin:var(--s4) 0}
.benefit .ic{flex:0 0 34px;height:34px;border-radius:11px;background:var(--blue-050);display:flex;align-items:center;justify-content:center;font-size:16px}
.benefit b{font-size:15px}
.benefit p{font-size:13px;color:var(--muted);line-height:1.4}
.price{font-family:var(--display);font-weight:800;font-size:22px;color:var(--blue-900);text-align:center;margin:var(--s4) 0 var(--s1)}
.price small{font-size:13px;color:var(--muted);font-weight:500;font-family:var(--body)}
/* Zugangscode */
.gate-overlay{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));display:flex;align-items:center;justify-content:center;padding:var(--pad)}
.gate-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:var(--s6) var(--s5)}
.gate-card h2{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--blue-900);margin-bottom:var(--s1)}
/* Lock */
.locked{position:relative;overflow:hidden;border-radius:var(--radius)}
.lock-cover{position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,250,253,.3),rgba(247,250,253,.97) 70%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:var(--s5);text-align:center;gap:var(--s3)}
.lock-cover .badge{background:var(--warm-soft);color:#966A22;font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px}
/* Meal-Prep */
.seg{display:flex;background:var(--blue-100);border-radius:14px;padding:4px;gap:4px;margin:0 0 var(--s4)}
.seg button{flex:1;border:0;cursor:pointer;padding:10px;border-radius:11px;background:transparent;font-family:var(--body);font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--blue-900);box-shadow:0 2px 8px rgba(28,56,77,.1)}
.pstepper{display:flex;align-items:center;justify-content:center;gap:var(--s4);background:var(--blue-050);border-radius:14px;padding:var(--s2) var(--s4);margin:0 0 var(--s4)}
.pstepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;cursor:pointer;color:var(--blue-700);line-height:1}
.pstepper button:disabled{opacity:.35;cursor:default}
.pstepper .pnum{font-family:var(--display);font-weight:700;font-size:16px;min-width:88px;text-align:center}
.star-rating{display:flex;gap:4px;margin-bottom:var(--s3)}
.star-rating button{background:none;border:0;cursor:pointer;padding:2px;font-size:24px;line-height:1;color:var(--line)}
.star-rating button.on{color:#E3A85C}
.preset-row{display:flex;gap:var(--s2);margin-top:var(--s2)}
.preset-row .chip-btn{padding:7px 12px}
.day-grid{display:flex;flex-direction:column;gap:var(--s3)}
.day-card{margin-bottom:0}
.day-card h3{font-family:var(--display);font-weight:800;font-size:16px;color:var(--blue-900);margin-bottom:var(--s3)}
.meal{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3);border:1px solid var(--line);border-radius:14px;margin-bottom:var(--s2);cursor:pointer;background:var(--surface)}
.meal:last-child{margin-bottom:0}
.meal .slot{flex:0 0 66px;font-size:11px;font-weight:700;color:var(--blue-500);text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
.meal b{font-size:14.5px;display:block}
.meal p{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.meal .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px;margin-left:auto}
.prep-box{background:var(--blue-050);border:1px solid var(--blue-100);border-radius:16px;padding:var(--s4) var(--s5);margin-bottom:var(--s5)}
.prep-box li{font-size:14px;line-height:1.55;margin-left:18px}
/* Kalender-Ansicht: echter Monatsraster */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.cal-nav b{font-family:var(--display);font-weight:800;font-size:15px;color:var(--blue-900);text-transform:capitalize}
.cal-arrow{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px;color:var(--blue-700)}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px;width:100%}
.cal-weekdays span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;overflow:hidden}
.cal-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:var(--s4);width:100%;overflow:hidden}
.mcell{aspect-ratio:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;gap:2px;overflow:hidden}
.mcell.empty{border:0;background:transparent;cursor:default}
.mcell .dnum{font-size:13px;font-weight:600;color:var(--ink);line-height:1}
.mcell.today .dnum{color:var(--blue-700);font-weight:800}
.mcell.today{border-color:var(--blue-500)}
.mcell.has{background:var(--blue-050)}
.mcell.sel{background:var(--blue-700);border-color:var(--blue-700)}
.mcell.sel .dnum{color:#fff}
.mcell .ddots{font-size:6px;color:var(--warm);letter-spacing:0;white-space:nowrap}
.mcell.sel .ddots{color:#fff}
/* Kochschule */
.path{position:relative;padding:var(--s2) 0 var(--s5)}
.node{display:flex;gap:var(--s4);align-items:center;margin-bottom:var(--s2);position:relative}
.node .dot{flex:0 0 54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--surface);border:2px solid var(--line);z-index:1}
.node.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.node.next .dot{background:var(--blue-700);border-color:var(--blue-700);color:#fff;box-shadow:0 0 0 6px var(--blue-100)}
.node.lock .dot{color:var(--blue-300)}
.node .info b{font-family:var(--display);font-size:15.5px;letter-spacing:-.01em;display:block}
.node .info span{font-size:12.5px;color:var(--muted)}
.node.lock .info b{color:var(--muted)}
.node:not(:last-child)::before{content:"";position:absolute;left:26px;top:54px;width:2px;height:14px;background:var(--line)}
.node.tappable{cursor:pointer}
.progress-head{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:var(--s4);margin-bottom:var(--s5)}
.progress-head b{font-family:var(--display);font-size:15px}
.pbar{height:8px;background:var(--blue-100);border-radius:4px;margin-top:var(--s2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue-700);border-radius:4px}
/* Quiz */
.quiz-opt{margin-bottom:0}
.quiz-opt.right{border-color:var(--good);background:#EFF7F2}
.quiz-opt.wrong{border-color:var(--bad);background:#FBF1ED}
.feedback{font-size:14px;font-weight:600;margin:var(--s3) 0 var(--s4)}
.feedback.ok{color:var(--good)}.feedback.no{color:var(--bad)}
/* Sonstiges */
.err-box{text-align:center;padding:var(--s7) var(--s3);margin-top:var(--s5)}
.err-box .e{font-size:34px;margin-bottom:var(--s3)}
.empty{text-align:center;padding:56px var(--s4);color:var(--muted)}
.empty .e{font-size:40px;margin-bottom:var(--s4)}
.empty b{display:block;font-family:var(--display);font-size:18px;color:var(--ink);margin-bottom:var(--s2)}
.usage-note{font-size:13px;color:var(--muted);text-align:center;margin-top:var(--s3)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--blue-200);border:0;cursor:pointer;position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--good)}.sw.on::after{left:23px}
.summary-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.summary-line:last-child{border-bottom:0}
.summary-line span{color:var(--muted)}
.summary-line b{text-align:right;max-width:60%}
/* Responsiv */
@media(min-width:640px){
  :root{--pad:40px}
  h1.screen{font-size:40px}

/* ============ STORAGE ============ */
/* localStorage ist auf file://-Origins (v.a. Safari, Privates Fenster) manchmal blockiert
   oder wirft beim Schreiben – daher zusätzlich ein In-Memory-Fallback, damit ein Wert
   innerhalb der laufenden Session immer verlässlich gespeichert bleibt. */
const __memoryStorage = {};
async function sget(key){
  try{
    const raw = localStorage.getItem(key);
    if(raw!==null) return JSON.parse(raw);
  }catch(e){}
  return Object.prototype.hasOwnProperty.call(__memoryStorage,key) ? __memoryStorage[key] : null;
}
async function sset(key,val){
  __memoryStorage[key]=val;
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.warn('storage',e); }
}

function extractJSON(text){
  let t = text.replace(/```json|```/g,'').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a===-1||b===-1) throw new Error('kein JSON gefunden');
  return JSON.parse(t.slice(a,b+1));
}

/* ============ PERSONENANZAHL / MENGEN-SKALIERUNG ============
   Fundament: Rezepte tragen basisPersonen + numerische Mengen (zutaten[].menge).
   Skalierung passiert rein lokal (kein erneuter API-Call). */
function parsePersonCount(answers){
  const m = /(\d+)\s*Person/i.exec((answers||{}).personen||'');
  const n = m ? parseInt(m[1],10) : 2;
  return (n>=1) ? n : 2;
}
/* Normalisiert einen Kochschritt auf {text, timer_seconds, requires_stove}.
   Ältere gespeicherte Rezepte (Favoriten/Historie) haben schritte noch als reinen String. */
function normalizeStep(s){
  if(typeof s==='string') return {text:s, timer_seconds:null, requires_stove:false};
  const timer = Number(s && s.timer_seconds);
  return {
    text: (s && s.text) || '',
    timer_seconds: (timer>0) ? Math.round(timer) : null,
    requires_stove: !!(s && s.requires_stove)
  };
}
function roundToStep(n, step){ return Math.round(n/step)*step; }
function scaleMenge(menge, einheit, faktor){
  const roh = Number(menge)*faktor;
  if(!isFinite(roh)) return menge;
  const e = (einheit||'').trim().toLowerCase();
  if(!einheit){ return Math.max(1, Math.ceil(roh)); } // zählbar: nie halbe Stück
  if(e==='g'||e==='ml'){ return roh>=20 ? roundToStep(roh,5) : Math.max(1,Math.round(roh)); }
  if(e==='tl'||e==='el'){ return roundToStep(roh,0.25); }
  return Math.round(roh*100)/100; // sonstige Einheiten: sinnvoll gerundet, kein hartes Schema vorgegeben
}
function scaleZutaten(zutaten, basisPersonen, neuePersonen){
  const basis = basisPersonen||2, ziel = Math.max(1, neuePersonen||basis);
  if(ziel===basis) return (zutaten||[]).map(z=>({...z}));
  const faktor = ziel/basis;
  return (zutaten||[]).map(z=>({...z, menge: scaleMenge(z.menge, z.einheit, faktor)}));
}
function fmtMenge(n){
  if(n===null||n===undefined||n==='') return '';
  const num = Number(n);
  if(isNaN(num)) return String(n);
  if(Number.isInteger(num)) return String(num);
  const fracMap = {0.25:'¼',0.5:'½',0.75:'¾'};
  const whole = Math.floor(num), rest = Math.round((num-whole)*100)/100;
  if(fracMap[rest]) return whole>0 ? `${whole}${fracMap[rest]}` : fracMap[rest];
  return String(Math.round(num*100)/100);
}

async function askClaude(userPrompt, system=SYSTEM_CHEF, maxTokens=1400, image=null){
  const call = async (tokens)=>{
    /* Wichtig: KEIN AbortSignal – der Vorschau-Proxy kann das Objekt nicht klonen.
       Timeout deshalb über Promise.race. */
    let res;
    try{
      const fetchP = fetch(SUPABASE_URL+'/functions/v1/ask-claude',{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization':'Bearer '+SUPABASE_ANON_KEY
        },
        body: JSON.stringify(image ? { prompt:userPrompt, system, maxTokens:tokens, image } : { prompt:userPrompt, system, maxTokens:tokens })
      });
      const timeoutP = new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),60000));
      res = await Promise.race([fetchP, timeoutP]);
    }catch(netErr){
      if(netErr.message==='TIMEOUT') throw new Error('Zeitüberschreitung nach 60 Sekunden – der Server hat nicht geantwortet.');
      throw new Error('Netzwerk: '+netErr.message+'.');
    }
    const data = await res.json().catch(()=>({}));
    if(data.error){
      throw new Error('API '+res.status+': '+(data.error.message||data.error.type||'unbekannt'));
    }
    if(!res.ok) throw new Error('API-Status '+res.status);
    const text = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
    if(!text.trim()) throw new Error('Leere Antwort vom Modell');
    try{ return extractJSON(text); }
    catch(pe){
      if(data.stop_reason==='max_tokens'){ const e=new Error('Antwort abgeschnitten (max_tokens) – JSON unvollständig'); e.maxTokensHit=true; throw e; }
      throw new Error('JSON nicht lesbar: '+pe.message);
    }
  };
  try{ return await call(maxTokens); }
  catch(e){
    /* Bei abgeschnittener Antwort: mit deutlich höherem Limit erneut versuchen, statt identisch zu wiederholen */
    const retryTokens = e.maxTokensHit ? Math.min(4000, Math.round(maxTokens*1.8)) : maxTokens;
    try{ return await call(retryTokens); }
    catch(e2){ S.lastErr = e2.message; throw e2; }
  }
}

function triggerPhotoIngredients(){

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{ const r=String(reader.result||''); const comma=r.indexOf(','); resolve(comma>=0?r.slice(comma+1):r); };
    reader.onerror = ()=>reject(new Error('Foto konnte nicht gelesen werden.'));
    reader.readAsDataURL(file);
  });
}
async function handlePhotoIngredients(inputEl){
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = '';
  if(!file) return;
  if(!file.type.startsWith('image/')){ S.gen.photoState='error'; S.gen.photoErrorMsg='Das scheint kein Bild zu sein.'; render(); return; }
  if(file.size > 10*1024*1024){ S.gen.photoState='error'; S.gen.photoErrorMsg='Foto ist zu groß (max. 10 MB).'; render(); return; }
  S.gen.photoState='loading'; S.gen.photoErrorMsg=''; render();
  try{
    const base64 = await fileToBase64(file);
    const data = await askClaude(
      'Analysiere dieses Foto und liste alle klar erkennbaren Lebensmittel/Zutaten auf.\nJSON-Schema (exakt, Deutsch, sonst nichts): {"zutaten":["Paprika","Zwiebel"]}',
      SYSTEM_VISION, 500, { media_type:file.type, data:base64 }
    );
    const found = Array.isArray(data.zutaten) ? data.zutaten.filter(x=>typeof x==='string' && x.trim()) : [];
    if(!found.length){
      S.gen.photoState='error';
      S.gen.photoErrorMsg='Nonna konnte auf dem Foto keine Zutaten erkennen. Versuch ein helleres, näheres Bild oder trag sie von Hand ein.';
      render(); return;
    }
    addIngredientsSilent(found.join(', '));
    S.gen.photoState='idle';
    track('ingredients_detected_from_photo', {count:found.length});
    render();
  }catch(e){
    S.gen.photoState='error';
    S.gen.photoErrorMsg = e.message || 'Foto konnte nicht ausgewertet werden.';
    render();
  }
}

/* ============ TIMER PRO KOCHSCHRITT + WAKE LOCK (Abschnitt 1) ============ */
let _timerTick = null;
let _wakeLock = null;
function timerKeyFor(i){
  const r = getCurrentRecipe();
  return (r && r.titel ? r.titel : 'x') + '::' + i;
}
function fmtTimer(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function anyTimerRunning(){ return Object.values(S.timers).some(t=>t.running); }
function ensureTimer(key, duration){
  if(!S.timers[key]) S.timers[key] = {remaining:duration, duration, running:false};
  return S.timers[key];
}
function updateTimerDOM(i){
  const key = timerKeyFor(i);
  const t = S.timers[key]; if(!t) return;
  const disp = el('timerDisp-'+i); if(disp) disp.textContent = fmtTimer(t.remaining);
  const btn = el('timerToggle-'+i); if(btn) btn.textContent = t.running ? '⏸' : '▶';
  const wrap = el('timerWrap-'+i); if(wrap) wrap.classList.toggle('running', t.running);
}
function startTimerTick(){
  if(_timerTick) return;
  _timerTick = setInterval(()=>{
    const r = getCurrentRecipe();
    const curTitel = (r && r.titel) ? r.titel : 'x';
    for(const key in S.timers){
      const t = S.timers[key];
      if(!t.running) continue;
      t.remaining = Math.max(0, t.remaining-1);
      if(t.remaining===0){ t.running=false; onTimerDone(); }
      if(key.startsWith(curTitel+'::')) updateTimerDOM(Number(key.slice((curTitel+'::').length)));
    }
    if(!anyTimerRunning()){ clearInterval(_timerTick); _timerTick=null; }
    updateWakeLock();
  }, 1000);
}
function toggleStepTimer(i, duration){
  const key = timerKeyFor(i);
  const t = ensureTimer(key, duration);
  t.running = !t.running;
  if(t.running){ requestNotificationPermission(); startTimerTick(); }
  updateTimerDOM(i);
  updateWakeLock();
}
function resetStepTimer(i, duration){
  const key = timerKeyFor(i);
  const t = ensureTimer(key, duration);
  t.running = false; t.remaining = duration;
  updateTimerDOM(i);
  updateWakeLock();
}
function onTimerDone(){ playTimerSound(); notifyTimerDone(); }
function playTimerSound(){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    [0,260,520].forEach(delay=>{
      setTimeout(()=>{
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type='sine'; o.frequency.value=880; g.gain.value=0.18;
        o.start(); o.stop(ctx.currentTime+0.18);
      }, delay);
    });
    setTimeout(()=>ctx.close(), 900);
  }catch(e){}
}
function requestNotificationPermission(){
  if('Notification' in window && Notification.permission==='default') Notification.requestPermission().catch(()=>{});
}
function notifyTimerDone(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  try{ new Notification('Nonna', {body:'⏱ Timer fertig – weiter geht\'s!'}); }catch(e){}
}
async function updateWakeLock(){
  const running = anyTimerRunning();
  if(running && !_wakeLock && 'wakeLock' in navigator){
    try{
      _wakeLock = await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener('release', ()=>{ _wakeLock=null; });
    }catch(e){}
  } else if(!running && _wakeLock){
    try{ await _wakeLock.release(); }catch(e){}
    _wakeLock = null;
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && anyTimerRunning() && !_wakeLock) updateWakeLock();
});

/* ============ VORLESEFUNKTION (Abschnitt 3, native speechSynthesis) ============ */
function startReadAloud(){
  const r = getCurrentRecipe();
  if(!r || !(r.schritte||[]).length) return;
  S.tts = {active:true, stepIndex:0};
  renderReadAloud();
  speakCurrentStep();
}
function renderReadAloud(){
  const r = getCurrentRecipe();
  const steps = (r.schritte||[]).map(normalizeStep);
  const i = S.tts.stepIndex;
  const step = steps[i];
  el('modal').innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeReadAloud()">
    <div class="sheet" style="text-align:center">
      <p class="usage-note" style="margin-top:0">Schritt ${i+1} von ${steps.length}</p>
      <p style="font-size:19px;line-height:1.5;font-family:var(--display);font-weight:600;margin:var(--s3) 0 var(--s4)">${esc(step.text)}</p>
      <div class="row" style="margin-bottom:var(--s3)">
        <button class="btn ghost" ${i<=0?'disabled':''} onclick="ttsPrevStep()">← Zurück</button>
        <button class="btn ghost" onclick="speakCurrentStep()">🔁 Nochmal vorlesen</button>
      </div>
      <button class="btn" onclick="ttsNextStep()">${i<steps.length-1?'Weiter →':'Fertig'}</button>
      <button class="btn ghost" style="margin-top:var(--s2)" onclick="closeReadAloud()">Schließen</button>
      ${('speechSynthesis' in window)?'':'<p class="usage-note">Dieses Gerät unterstützt keine Sprachausgabe – die Schritte werden nur angezeigt.</p>'}
    </div>
  </div>`;
}
function speakCurrentStep(){
  if(!('speechSynthesis' in window)) return;
  const r = getCurrentRecipe();
  const steps = (r.schritte||[]).map(normalizeStep);
  const step = steps[S.tts.stepIndex];
  if(!step) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(step.text);
  u.lang = 'de-DE';
  window.speechSynthesis.speak(u);
}
function ttsNextStep(){
  const r = getCurrentRecipe();
  const steps = (r.schritte||[]).map(normalizeStep);
  if(S.tts.stepIndex >= steps.length-1){ closeReadAloud(); return; }
  S.tts.stepIndex++;
  renderReadAloud();
  speakCurrentStep();
}
function ttsPrevStep(){
  if(S.tts.stepIndex<=0) return;
  S.tts.stepIndex--;
  renderReadAloud();
  speakCurrentStep();

async function logHistory(recipe){
  if(!recipe || !recipe.titel) return;
  const idx = S.history.findIndex(h=>h.titel===recipe.titel);
  const prevRating = idx>=0 ? (S.history[idx].rating||0) : 0;
  if(idx>=0) S.history.splice(idx,1);
  S.history.unshift({...recipe, viewedAt:Date.now(), rating:prevRating});
  if(S.history.length>100) S.history.length = 100;
  await sset('nonna:history', S.history);
}
async function setRecipeRating(n){
  const r = getCurrentRecipe();
  if(!r) return;
  r.rating = (r.rating||0)===n ? 0 : n;
  const idx = S.history.findIndex(h=>h.titel===r.titel);
  if(idx>=0){ S.history[idx].rating = r.rating; }
  else { S.history.unshift({...r, viewedAt:Date.now()}); if(S.history.length>100) S.history.length=100; }
  await sset('nonna:history', S.history);
  const fidx = S.favs.findIndex(f=>f.titel===r.titel);
  if(fidx>=0){ S.favs[fidx].rating = r.rating; await sset('nonna:favorites', S.favs); }
  track('recipe_rated', {titel:r.titel, rating:r.rating});
  render();
}

async function generateMealplan(){
  keepMpInput();
  const m=S.mp;
  if(!m.ingredients.trim()){ render(); return; }
  m.step='loading'; render();
  try{
    /* Chunking: max ~15 Mahlzeiten-Slots pro API-Call */
    const chunkDays = Math.max(1, Math.floor(15/m.meals));
    const chunks=[];
    for(let start=1; start<=m.days; start+=chunkDays){
      chunks.push([start, Math.min(m.days, start+chunkDays-1)]);
    }
    let prepSession=[], plan=[];
    for(let ci=0; ci<chunks.length; ci++){
      const [von,bis]=chunks[ci];
      const p=el('phrase'); if(p){ p.dataset.lock='1'; p.textContent=`Tag ${von}–${bis} wird geplant … (${ci+1}/${chunks.length})`; }
      const prompt = `Erstelle einen Teil eines Meal-Prep-Plans.
Vorhandene Zutaten: ${m.ingredients}
Gesamtzeitraum: ${m.days} Tage mit je ${m.meals} Mahlzeit(en). Plane JETZT NUR Tag ${von} bis Tag ${bis} (Feld "tag" mit diesen absoluten Tagesnummern).
${ci>0?`Bereits geplante Gerichte (nicht wiederholen): ${plan.map(x=>x.titel).join('; ')}`:''}
${S.answers?`Kontext zum Nutzer:\n${answersText(S.answers)}`:''}
${dietaryConstraintsText()}${kitchenStaplesText()}
${ci===0?`Erstelle zusätzlich eine gebündelte Prep-Session für den GESAMTEN Zeitraum (was wird einmal vorbereitet und mehrfach verwendet).`:'Feld "prepSession" als leeres Array zurückgeben.'}
Sehr kompakt. JSON-Schema (exakt, Deutsch):
{"prepSession":["max 5 kurze Punkte"],"plan":[{"tag":${von},"mahlzeit":"Frühstück|Mittag|Abend","titel":"...","kurzbeschreibung":"max 1 Satz","prepHinweis":"max 5 Wörter"}]}`;
      const data = await askClaude(prompt, SYSTEM_CHEF, 2000);
      if(!data.plan) throw new Error('Schema: "plan" fehlt (Etappe '+(ci+1)+')');
      if(ci===0) prepSession = data.prepSession||[];
      plan = plan.concat(data.plan);
    }
    S.mealplan = {createdAt:Date.now(), startDate:m.startDate, days:m.days, prepSession, plan};
    await sset('nonna:mealplan', S.mealplan);
    m.step='idle'; m.view='plan'; m.calMonth=null;
    track('mealplan_generated', {days:m.days, meals_per_day:m.meals});
  }catch(e){ S.lastErr = S.lastErr||e.message; m.step='error'; }
  render();
}

function calGridHTML(p){
  const m=S.mp;
  const byDate = {};
  p.plan.forEach((x,i)=>{ const iso=isoDate(dayFor(p,x.tag)); (byDate[iso]=byDate[iso]||[]).push({...x,_i:i}); });

  /* Monat bestimmen: Standard = Monat des Planstarts */
  if(!m.calMonth){
    const base = p.startDate ? new Date(p.startDate+'T00:00:00') : new Date();
    m.calMonth = base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0');
  }
  const [Y,M] = m.calMonth.split('-').map(Number);
  const first = new Date(Y, M-1, 1);
  const monthName = first.toLocaleDateString('de-DE',{month:'long', year:'numeric'});
  const startOffset = (first.getDay()+6)%7; // Montag=0
  const daysInMonth = new Date(Y, M, 0).getDate();
  const weekdays=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const todayIso = isoDate(new Date());

  let cells='';
  for(let i=0;i<startOffset;i++) cells+=`<div class="mcell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const meals = byDate[iso]||[];
    const isToday = iso===todayIso;
    const sel = m.calSelected===iso;
    cells += `<div class="mcell ${meals.length?'has':''} ${isToday?'today':''} ${sel?'sel':''}" onclick="selectCalDay('${iso}')">
      <span class="dnum">${d}</span>
      ${meals.length?`<span class="ddots">${meals.slice(0,3).map(()=>'●').join('')}</span>`:''}
    </div>`;
  }

  const selMeals = m.calSelected ? (byDate[m.calSelected]||[]) : [];
  return `
  <div class="cal-nav">

function shiftCalMonth(dir){
  const [Y,M]=S.mp.calMonth.split('-').map(Number);
  const d=new Date(Y,M-1+dir,1);
  S.mp.calMonth = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  render();

function dayFor(plan, tag){
  const base = plan.startDate ? new Date(plan.startDate+'T00:00:00') : (()=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(0,0,0,0);return d;})();
  const d=new Date(base); d.setDate(base.getDate()+((tag||1)-1)); return d;
}
function exportICS(){
  const p=S.mealplan; if(!p||!p.plan.length) return;
  const pad=n=>String(n).padStart(2,'0');
  const fmt=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const clean=s=>String(s||'').replace(/[\r\n,;]/g,' ');
  let ev='';
  p.plan.forEach((m,i)=>{
    const d=dayFor(p, m.tag);
    const t=(m.mahlzeit||'').toLowerCase();
    let h=12,mi=0;
    if(t.includes('früh')) h=8;
    else if(t.includes('mittag')){h=12;mi=30;}
    else if(t.includes('abend')) h=19;
    d.setHours(h,mi,0,0);
    const e=new Date(d.getTime()+45*60000);
    ev+=`BEGIN:VEVENT\r\nUID:nonna-${Date.now()}-${i}@nonna.app\r\nDTSTAMP:${fmt(new Date())}\r\nDTSTART:${fmt(d)}\r\nDTEND:${fmt(e)}\r\nSUMMARY:${clean(m.mahlzeit)}: ${clean(m.titel)}\r\nDESCRIPTION:${clean(m.kurzbeschreibung)}\r\nEND:VEVENT\r\n`;
  });
  const ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Nonna//Essensplan//DE\r\n${ev}END:VCALENDAR\r\n`;
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='nonna-essensplan.ics';
  document.body.appendChild(a); a.click(); a.remove();
}

{"titel":"...","konzept":"1 Satz","zutatenanalyse":"1 Satz","basisPersonen":${parsePersonCount(S.answers)},"zutaten":[{"menge":200,"einheit":"g","name":"..."},{"menge":2,"einheit":null,"name":"große Eier"}],"schritte":[{"text":"...","timer_seconds":300,"requires_stove":true}],"anrichten":"1 Satz","geschmacksprofil":"1 Satz"}

  if(!/^\d{16}$/.test(card)){ if(err) err.textContent='Bitte eine 16-stellige Kartennummer angeben.'; return; }
  if(!/^\d{2}\/\d{2}$/.test(expiry)){ if(err) err.textContent='Bitte das Ablaufdatum im Format MM/JJ angeben.'; return; }
  if(!/^\d{3,4}$/.test(cvc)){ if(err) err.textContent='Bitte einen gültigen CVC angeben.'; return; }
  if(!S.account){ S.account={name, mail, createdAt:Date.now()}; await sset('nonna:account', S.account); }
  S.pro=true;
  await sset('nonna:pro', true);
  track('purchase', {value:4.99, currency:'EUR', items:[{item_name:'Nonna Famiglia', item_category:'subscription'}]});
  render();
  openPurchaseConfirm();
}
function openPurchaseConfirm(){
  el('modal').innerHTML = `
  <div class="overlay" onclick="if(event.target===this){closeModal();}">
    <div class="sheet" style="text-align:center">
      <div style="font-size:40px;margin-bottom:var(--s2)">🎉</div>
      <h2 style="font-family:var(--serif);font-style:italic">Willkommen in der Famiglia.</h2>
      <p class="sub" style="margin-bottom:var(--s4)">Jetzt kann's richtig losgehen – unbegrenzt kochen, Lieblinge sammeln, die Woche planen.</p>
      <button class="btn warm" onclick="closeModal()">Los geht's</button>
    </div>
  </div>`;
}
/* ============ EINSTELLUNGEN (Profil-Sheet) ============
   nonna:profile bündelt Allergien, Alter, Wohnort, Passwort (rein lokal
   simuliert – siehe Kommentar bei saveProfileText) und die Diät-Grundeinstellung
   in einem Key statt vieler Einzel-Keys. */
const ALLERGY_CATEGORIES = ['Gluten','Laktose','Nüsse','Schalenfrüchte','Ei','Soja','Fisch/Meeresfrüchte','Histamin'];
let _profileEditQ = null; // Index in QUESTIONS, solange eine einzelne Frage granular bearbeitet wird

function openProfile(){
  _profileEditQ = null;
  el('modal').innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="sheet" id="profileSheet">${profileMainHTML()}</div>
  </div>`;
}
function profileMainHTML(){
  const left=usageLeft();
  return `
      <h2>Profil & Einstellungen</h2>
      <div class="toggle"><div><b style="font-size:15px">Nonna Famiglia</b><p style="font-size:13px;color:var(--muted)">Simulierter Mitgliedschaftsstatus (Demo)</p></div>
        <button class="sw ${S.pro?'on':''}" onclick="toggleProSwitch()" aria-label="Pro umschalten"></button></div>
      <div class="toggle"><div><b style="font-size:15px">Konto</b><p style="font-size:13px;color:var(--muted)">${S.account?esc(S.account.name)+' · '+esc(S.account.mail):'Nicht angemeldet'}</p></div>
        ${S.account?'<button class="chip-btn" onclick="logoutAccount()">Abmelden</button>':''}</div>
      <div class="toggle"><div><b style="font-size:15px">Gratis-Runden</b><p style="font-size:13px;color:var(--muted)">${S.pro?'Unbegrenzt mit Pro':S.account?`Noch ${left} von ${FREE_LIMIT} in dieser Woche`:'Anmeldung erforderlich'}</p></div></div>

      <div class="sec-label" style="margin-top:var(--s5)">Deine 5 Antworten</div>
      ${S.answers ? QUESTIONS.map((q,i)=>`
        <div class="toggle"><div><b style="font-size:14.5px">${esc(Q_SHORT[q.key])}</b><p style="font-size:13px;color:var(--muted)">${esc(S.answers[q.key]||'–')}</p></div>
          <button class="chip-btn" onclick="editProfileAnswer(${i})">Ändern</button></div>`).join('')
        : `<p class="sub" style="margin-bottom:0">Noch keine – koch einmal, dann merkt Nonna sich alles.</p>`}
      ${S.answers?`<button class="btn ghost" style="margin-top:var(--s2)" onclick="clearAnswers()">Alle 5 zurücksetzen</button>`:''}

      <div class="sec-label" style="margin-top:var(--s5)">Allergien & Unverträglichkeiten</div>
      <div class="chips">
        ${ALLERGY_CATEGORIES.map(a=>`<button class="chip-btn ${S.profile.allergies.includes(a)?'on':''}" onclick="toggleAllergy('${esc(a)}')">${esc(a)}</button>`).join('')}
      </div>
      <input class="field" style="margin-top:var(--s3)" id="profAllergyOther" type="text" placeholder="Weitere, durch Komma getrennt" value="${esc(S.profile.allergiesOther||'')}" onblur="saveProfileText('allergiesOther', this.value)">
      <p class="usage-note">Nonna übernimmt keine Gewähr für Kreuzkontamination – bei ernsten Allergien bitte zusätzlich selbst prüfen.</p>

      <div class="sec-label">Ernährungsweise</div>
      <div class="seg">
        <button class="${S.profile.diet==='keine'?'on':''}" onclick="setDiet('keine')">Keine Einschränkung</button>
        <button class="${S.profile.diet==='vegetarisch'?'on':''}" onclick="setDiet('vegetarisch')">Vegetarisch</button>
        <button class="${S.profile.diet==='vegan'?'on':''}" onclick="setDiet('vegan')">Vegan</button>
      </div>

      <div class="sec-label">Küchenschrank</div>
      <p class="sub" style="margin-bottom:var(--s2)">Diese Grundzutaten gelten bei jedem Rezept als vorhanden – du musst sie nie eintragen.</p>
      <div class="chips">
        ${S.profile.kitchenStaples.map((z,i)=>`<span class="chip">${esc(z)}<button onclick="removeKitchenStaple(${i})" aria-label="Entfernen">✕</button></span>`).join('')}
      </div>
      <div class="row" style="margin-top:var(--s2)">
        <input class="field" id="staplesInput" type="text" placeholder="z. B. Sojasauce" onkeydown="if(event.key==='Enter'){event.preventDefault();addKitchenStapleFromInput();}">
        <button class="btn ghost" style="padding:10px 16px" onclick="addKitchenStapleFromInput()">Hinzufügen</button>
      </div>

      <div class="sec-label" style="margin-top:var(--s5)">Gewürze</div>
      <p class="sub" style="margin-bottom:var(--s2)">Genauso: diese Gewürze setzt Nonna immer voraus.</p>
      <div class="chips">
        ${S.profile.spices.map((z,i)=>`<span class="chip">${esc(z)}<button onclick="removeSpice(${i})" aria-label="Entfernen">✕</button></span>`).join('')}
      </div>
      <div class="row" style="margin-top:var(--s2)">
        <input class="field" id="spicesInput" type="text" placeholder="z. B. Paprikapulver" onkeydown="if(event.key==='Enter'){event.preventDefault();addSpiceFromInput();}">
        <button class="btn ghost" style="padding:10px 16px" onclick="addSpiceFromInput()">Hinzufügen</button>
      </div>

      <div class="sec-label" style="margin-top:var(--s5)">Weitere Angaben</div>
      <input class="field" id="profAge" type="number" min="1" max="120" placeholder="Alter" value="${esc(S.profile.age||'')}" onblur="saveProfileText('age', this.value)">
      <input class="field" style="margin-top:var(--s2)" id="profLocation" type="text" placeholder="Wohnort" value="${esc(S.profile.location||'')}" onblur="saveProfileText('location', this.value)">
      <input class="field" style="margin-top:var(--s2)" id="profPassword" type="password" placeholder="Passwort" value="${esc(S.profile.password||'')}" onblur="saveProfileText('password', this.value)">
      <p class="usage-note">Rein lokal gespeichert, kein echter Sicherheitsmechanismus – Nonna hat kein Backend-Login.</p>

      <button class="btn ghost" style="margin-top:var(--s4)" onclick="closeModal()">Schließen</button>`;
}
function refreshProfileSheet(){ const sh=el('profileSheet'); if(sh) sh.innerHTML = _profileEditQ!==null ? profileEditAnswerHTML() : profileMainHTML(); }
async function toggleAllergy(cat){
  const i = S.profile.allergies.indexOf(cat);
  if(i>=0) S.profile.allergies.splice(i,1); else S.profile.allergies.push(cat);
  await sset('nonna:profile', S.profile);
  refreshProfileSheet();
}
async function setDiet(v){ S.profile.diet=v; await sset('nonna:profile', S.profile); refreshProfileSheet(); }
async function addKitchenStaple(v){
  const parts = (v||'').split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean);
  for(const p of parts){ if(!S.profile.kitchenStaples.some(x=>x.toLowerCase()===p.toLowerCase())) S.profile.kitchenStaples.push(p); }
  await sset('nonna:profile', S.profile);
  refreshProfileSheet();
}
function addKitchenStapleFromInput(){ const i=el('staplesInput'); if(!i) return; addKitchenStaple(i.value); }
async function removeKitchenStaple(i){ S.profile.kitchenStaples.splice(i,1); await sset('nonna:profile', S.profile); refreshProfileSheet(); }
async function addSpice(v){
  const parts = (v||'').split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean);
  for(const p of parts){ if(!S.profile.spices.some(x=>x.toLowerCase()===p.toLowerCase())) S.profile.spices.push(p); }
  await sset('nonna:profile', S.profile);
  refreshProfileSheet();
}
function addSpiceFromInput(){ const i=el('spicesInput'); if(!i) return; addSpice(i.value); }
async function removeSpice(i){ S.profile.spices.splice(i,1); await sset('nonna:profile', S.profile); refreshProfileSheet(); }
async function saveProfileText(key,val){
  /* Hinweis: 'password' ist ein reines Freitextfeld ohne Hashing/Session – rein lokale
     Simulation des Account-Konzepts, KEIN echter Auth-Mechanismus. */
  S.profile[key] = (val||'').trim();
  await sset('nonna:profile', S.profile);
}
function editProfileAnswer(i){ _profileEditQ=i; refreshProfileSheet(); }
function profileEditAnswerHTML(){
  const q = QUESTIONS[_profileEditQ];
  const cur = S.answers?.[q.key];
  return `
      <button class="back" style="margin-bottom:var(--s3)" onclick="_profileEditQ=null;refreshProfileSheet()">← Zurück zum Profil</button>
      <h2 style="font-size:20px">${esc(q.q)}</h2>
      <div class="opts">
        ${q.opts.map(o=>{
          const val = o.s ? `${o.t} (${o.s})` : o.t;
          return `<button class="opt ${cur===val?'sel':''}" onclick="pickProfileAnswer('${q.key}', ${JSON.stringify(val).replace(/"/g,'&quot;')})">
            <div class="t">${esc(o.t)}</div>${o.s?`<div class="s">${esc(o.s)}</div>`:''}
          </button>`;
        }).join('')}
      </div>`;
}
async function pickProfileAnswer(key,val){
  S.answers = {...(S.answers||{}), [key]:val};
  await sset('nonna:answers', S.answers);
  _profileEditQ=null;
  refreshProfileSheet();
}
/* Fasst Allergien/Diät als harte Ausschlussregeln für den System-Prompt zusammen –
   wird in generateConcepts/openDetail/generateMealplan/openMealDetail angehängt. */
function dietaryConstraintsText(){
  const allergyList = [...(S.profile.allergies||[])];
  if(S.profile.allergiesOther && S.profile.allergiesOther.trim()){
    allergyList.push(...S.profile.allergiesOther.split(',').map(s=>s.trim()).filter(Boolean));
  }
  const parts=[];
  if(allergyList.length) parts.push(`ALLERGIEN/UNVERTRÄGLICHKEITEN – verwende unter keinen Umständen: ${allergyList.join(', ')}. Das ist eine harte Sicherheitsregel, keine Geschmackspräferenz.`);
  if(S.profile.diet==='vegan') parts.push('Diät: STRIKT VEGAN – keine tierischen Produkte (kein Fleisch, Fisch, Ei, Milchprodukte, Honig).');
  else if(S.profile.diet==='vegetarisch') parts.push('Diät: STRIKT VEGETARISCH – kein Fleisch, kein Fisch.');
  if(parts.length) parts.push('Diese Grundeinstellungen sind bindend und stehen über der Zutatenliste des Nutzers UND über jedem Einzelwunsch/Foto. Widerspricht eine vom Nutzer genannte Zutat dem, lass sie einfach weg oder ersetze sie sinnvoll – kein Fehler, kein Abbruch, keine Rückfrage.');
  return parts.length ? '\n'+parts.join('\n') : '';
}
function kitchenStaplesText(){
  const items = [...(S.profile.kitchenStaples||[]), ...(S.profile.spices||[])];
  return items.length ? `\nDiese Grundzutaten/Gewürze gelten als vorhanden – der Nutzer muss sie nicht extra angeben, du darfst frei damit arbeiten: ${items.join(', ')}.` : '';
}
/* ============ PERSONALISIERUNG (Abschnitt 2) ============
   Präferenzprofil wird nicht clientseitig strukturiert extrahiert (kein NLP verfügbar),
   sondern als Rohkontext bewerteter Gerichte an das Modell übergeben – das leitet daraus
   selbst Küche/Zutaten/Schärfe/Zubereitungsart ab. Aktiv erst ab RATING_MIN_FOR_PERSONALIZATION Bewertungen. */
const RATING_MIN_FOR_PERSONALIZATION = 5;
function ratedHistoryCount(){ return S.history.filter(h=>h.rating>0).length; }
function preferenceProfileText(){
  if(ratedHistoryCount() < RATING_MIN_FOR_PERSONALIZATION) return '';
  const rated = S.history.filter(h=>h.rating>0);
  const liked = rated.filter(h=>h.rating>=4).slice(0,8);
  const disliked = rated.filter(h=>h.rating<=2).slice(0,8);
  if(!liked.length && !disliked.length) return '';
  const summarize = h=>`${h.titel}${h.konzept?' ('+h.konzept+')':''}`;
  const parts = ['PERSONALISIERUNG – leite aus diesen vom Nutzer bewerteten Gerichten ein Geschmacksprofil ab (bevorzugte/abgelehnte Zutaten, Küchenstil, Schärfegrad, Zubereitungsart) und richte die 5 Vorschläge grundsätzlich danach aus:'];
  if(liked.length) parts.push(`Gefiel dem Nutzer gut (4-5 Sterne): ${liked.map(summarize).join('; ')}`);
  if(disliked.length) parts.push(`Gefiel dem Nutzer nicht (1-2 Sterne): ${disliked.map(summarize).join('; ')}`);
  parts.push('WICHTIG: Von den 5 Konzepten müssen genau 2 bewusste AUSREISSER sein – deutlich anders als das abgeleitete Profil (andere Küche, andere Hauptzutat oder andere Zubereitungsart als die bevorzugten Gerichte), gezielt gegensätzlich gewählt statt zufällig, um den Geschmack des Nutzers zu erweitern. Markiere genau diese 2 Konzepte mit "ausreisser":true, die übrigen 3 mit "ausreisser":false.');
  return '\n'+parts.join('\n');
}
async function toggleProSwitch(){ S.pro=!S.pro; await sset('nonna:pro',S.pro); openProfile(); render(); }
async function clearAnswers(){ S.answers=null; await sset('nonna:answers',null); openProfile(); }
function closeModal(){ el('modal').innerHTML=''; }

/* ============ GESTAFFELTE ONBOARDING-POP-UPS (Abschnitt 8) ============ */
function onboardingModalHTML(heading, text, ctaLabel, ctaOnclick, popupKey){
  return `
  <div class="overlay" onclick="if(event.target===this)dismissOnboarding('${popupKey}')">
    <div class="sheet" style="text-align:center;position:relative">
      <button onclick="dismissOnboarding('${popupKey}')" aria-label="Schließen" style="position:absolute;top:var(--s3);right:var(--s3);width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;color:var(--muted)">✕</button>
      ${heading?`<h2 style="font-family:var(--serif);font-style:italic;margin-top:0">${esc(heading)}</h2>`:''}
      <p class="sub" style="margin:${heading?'var(--s2)':'0'} 0 var(--s4)">${esc(text)}</p>
      <button class="btn warm" onclick="${ctaOnclick}">${esc(ctaLabel)}</button>
    </div>
  </div>`;
}
async function dismissOnboarding(key){
  S.onboarding[key] = true;
  await sset('nonna:onboarding', S.onboarding);
  closeModal();
}
async function openProfileFromOnboarding(key){
  await dismissOnboarding(key);
  openProfile();
}
function openOnboarding0(){
  el('modal').innerHTML = onboardingModalHTML('', `Ich lerne von dir. Bewerte meine Rezepte – so weiß ich, was dir schmeckt. Aber ganz verwöhnen lass ich dich nicht: hin und wieder gibt's was Neues. È sempre casa mia, no? 😉`, 'Weiter Kochen', "dismissOnboarding('popup0')", 'popup0');
}
function openOnboarding1(){
  el('modal').innerHTML = onboardingModalHTML('Wer isst heute mit?', `Kein Fleisch, keine Tierprodukte? Ma va bene! Sag's mir unter Einstellungen → Famiglia, dann koch ich nur, was dir wirklich schmeckt.`, 'Jetzt einrichten', "openProfileFromOnboarding('popup1')", 'popup1');
}
function openOnboarding2(){
  el('modal').innerHTML = onboardingModalHTML('Was hast du immer daheim?', 'Öl, Salz, Peperoncino – jede Küche hat ihre Klassiker. Trag\'s ein unter Einstellungen → Famiglia, dann muss ich nicht ständig fragen.', 'Küchenschrank füllen', "openProfileFromOnboarding('popup2')", 'popup2');
}
function openOnboarding3(){
  el('modal').innerHTML = onboardingModalHTML('Nicht jeder verträgt alles – così è la vita.', 'Allergie oder Unverträglichkeit? Unter Einstellungen → Famiglia eintragen, dann pass ich für dich auf.', 'Jetzt eintragen', "openProfileFromOnboarding('popup3')", 'popup3');
}
function maybeShowOnboardingPopup(){
  if(el('modal').innerHTML.trim()) return; // kein anderes Modal überdecken
  if(S.visits===1){
    if(!S.onboarding.popup0) openOnboarding0();
    return;
  }
  if(!S.onboarding.popup1){ openOnboarding1(); return; }
  if(!S.onboarding.popup2){ openOnboarding2(); return; }
  if(!S.onboarding.popup3){ openOnboarding3(); return; }
}

/* ============ INIT ============ */
(async function(){
  el('app').innerHTML = loaderHTML('concepts');
  try{ await loadAll(); }catch(e){}
  stopLoader();
  render();
  track('screen_view', {screen_name:S.tab});
  maybeShowOnboardingPopup();
})();
</script>
</body>
</html>
